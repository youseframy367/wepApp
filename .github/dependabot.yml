version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/python-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      python-security:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"

  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/microservices/go-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      go-security:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
